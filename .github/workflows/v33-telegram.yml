name: Tracker v3.3 Telegram (separate bot)

# Distinct v3.3 bot, separate research branch and state.
# Does not use or modify production v3.1 or experimental v3.2 bot/state.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v33-telegram.yml'
  schedule:
    - cron: '6-59/5 * * * *'
  # Extra wake-ups driven by existing production workflows, without editing them.
  workflow_run:
    workflows:
      - 'Polymarket Smart Tracker v3.1 Fresh'
      - 'Tracker v3.2 Experimental Telegram (separate bot)'
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v33-telegram-separate-writer
  # A code deployment replaces the old 50m runner immediately.
  # Normal scheduled runs do NOT interrupt an active monitoring session.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  v33-telegram:
    # Do not react to failed workflows or runs from unexpected branches.
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Check out isolated v3.3 research branch only
        uses: actions/checkout@v4
        with:
          ref: v3.3-wallet-research
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 'Audit-gated sports book-shadow measurement, unchanged Telegram BUY risk filters'
        env:
          PYTHONPATH: .
          # Test under the same minimum source BUY as the live process.
          V33_MIN_TRADE_USD: '35'
          V33_MONITOR_MAX: '350'
          V33_MAX_ALERTS: '10'
          V33_MARKET_FOCUS: 'sports_btc'
          # Safety regression: wallet with many screenshot-confirmed settled UFC losses.
          V33_QUARANTINE_WALLETS: '0x31550df5402226b825f900a31659a05d809d268e,0x300317934bfe0cc8740affc7425b0cd3772530f5,0x6b1dbe91847aa95386fc63669ff910e68469a01a,0xa772e2ca9f119162d03330f3e66c0556a2068686'
        run: |
          python -m py_compile tools/v33_signal_bot.py
          python -m unittest discover -s tests -p 'test_v33_signal_bot.py' -v

      - name: Monitor shortlisted wallets and notify via DISTINCT bot
        env:
          PYTHONPATH: .
          TELEGRAM_V31_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_V32_BOT_TOKEN: ${{ secrets.TELEGRAM_V32_BOT_TOKEN }}
          TELEGRAM_V33_BOT_TOKEN: ${{ secrets.TELEGRAM_V33_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          V33_MONITOR_MAX: '350'
          # BOUNDED 350-WALLET PILOT: +46 risk-qualified wallets in current
          # shortlist snapshot. Roll back both V33_MONITOR_MAX values to 300
          # if request_errors/poll_gaps or runtime regress. No filter changes.
          # Dedicated OPEN-position research alerts, NOT fresh BUY.
          # Scan 4 wallets per poll, cap 3 clearly labeled OPEN messages/hour.
          V33_OPEN_ALERTS_ENABLED: '1'
          V33_OPEN_SCAN_PER_POLL: '4'
          V33_OPEN_MAX_ALERTS_PER_HOUR: '3'
          V33_OPEN_MIN_POSITION_USD: '35'
          # Risk/API failures are now cached for 10min (fail-closed);
          # confirmed loss inventory vetoes return immediately, with no
          # repetitive 1,000-position pagination for each candidate.
          # Sports games first; BTC only from crypto.
          # No altcoins, politics, movies or distant markets.
          V33_MARKET_FOCUS: 'sports_btc'
          # Silent if no verified BUY instead of hourly Telegram noise.
          V33_QUIET_STATUS_ENABLED: '0'
          # Don't spam Telegram with opposing-wallet warnings. Still veto
          # ambiguous BUYs and retain conflict counts in internal state.
          V33_CONFLICT_TELEGRAM_ENABLED: '0'
          # Favor user-requested active Bitcoin 5-minute wallet, but keep
          # standard candidate and order-book safety checks.
          V33_PRIORITY_WALLETS: '0x5b6331e7ff0831a3fe2ed12004747db1a9c911a4'
          # Temporary evidence-based quarantine; not a global strategy score.
          V33_QUARANTINE_WALLETS: '0x31550df5402226b825f900a31659a05d809d268e,0x300317934bfe0cc8740affc7425b0cd3772530f5,0x6b1dbe91847aa95386fc63669ff910e68469a01a,0xa772e2ca9f119162d03330f3e66c0556a2068686'
          # $35+ wallet BUY, still requiring tradable $5 book and risk verification.
          V33_MIN_TRADE_USD: '35'
          V33_MIN_PRICE: '0.15'
          V33_MAX_PRICE: '0.85'
          V33_MAX_ALERTS: '10'
          # Recent scoring includes CLOSED + settled unredeemed losses.
          # Last-position-activity is not the actual settlement date.
          # Require 6+ material unredeemed losers before this veto.
          V33_MIN_RECENT_LOSS_USD: '5'
          V33_MAX_UNREDEEMED_LOSSES_24H: '5'
          # Additional safety stop: >=4 severe settled losses in last 90d
          # of observed position activity, incl. archived unredeemed losses.
          V33_MAJOR_UNREDEEMED_LOSS_USD: '100'
          V33_MAX_MAJOR_LOSSES_90D: '3'
          # Never notify on political markets (Gamma event tags + title guard).
          V33_EXCLUDE_POLITICS: '1'
          V33_MAX_PRICE_RISE: '0.05'
          # Defensive risk limits; copied quotes are research-only.
          V33_MAX_PRICE_DROP: '0.05'
          V33_MAX_SPREAD: '0.05'
          V33_MAX_BOOK_SLIPPAGE: '0.02'
          # Skip wallets with mostly-red open holdings or a deep ACTIVE drawdown.
          V33_ACTIVE_MAX_RED_FRACTION: '0.60'
          V33_ACTIVE_MAX_DRAWDOWN: '0.15'
        run: |
          # Keep one GitHub runner watching for ~50 minutes per schedule
          # event; a delayed cron need not create a 30-40m blind spot.
          # Persist cursors/dedupe every three polls, not only at job end.
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          START=$SECONDS
          pass=0
          errors=0
          START_ALERTS=$(python -c "import json; print(json.load(open('research/v33_signal_state.json')).get('counters',{}).get('alerts_sent',0))")
          while (( SECONDS - START < 3000 )); do
            pass=$((pass + 1))
            echo "V33 CONTINUOUS POLL #${pass} at $(date -u +%FT%TZ)"
            if python -u tools/v33_signal_bot.py; then
              :
            else
              errors=$((errors + 1))
              echo "V33 POLL FAILURE #${errors}; will retry on next pass"
            fi
            # Persist every genuine BUY immediately after sending, not
            # just every third poll, to reduce replay on runner interruption.
            CURRENT_ALERTS=$(python -c "import json; print(json.load(open('research/v33_signal_state.json')).get('counters',{}).get('alerts_sent',0))")
            if (( pass % 3 == 0 || CURRENT_ALERTS > START_ALERTS )); then
              git add research/v33_signal_state.json
              if ! git diff --cached --quiet; then
                git commit -m 'chore(v3.3): checkpoint Telegram cursors [skip ci]'
                pushed=false
              for attempt in 1 2 3 4 5; do
                git fetch origin v3.3-wallet-research
                git rebase origin/v3.3-wallet-research
                if git push origin HEAD:v3.3-wallet-research; then
                  pushed=true
                  break
                fi
                sleep 3
              done
              test "$pushed" = true
              fi
              START_ALERTS=$CURRENT_ALERTS
            fi
            # 45s + API work keeps 5-minute crypto signals fresher.
            sleep 45
          done
          echo "V33 SESSION SUMMARY passes=${pass} errors=${errors}"
          echo "### v3.3 monitoring session" >> "$GITHUB_STEP_SUMMARY"
          echo "- Polls: ${pass}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Failed polls: ${errors}" >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          data = json.load(open("research/v33_signal_state.json"))
          last = data.get("last_run") or {}
          print("- Wallets scanned:", last.get("watching", "?"))
          print("- Recently sports-active qualified wallets:",
                last.get("sports_recent_watching", "not available"))
          print("- Recently BTC-active qualified wallets:",
                last.get("crypto_recent_watching", "not available"))
          counts = data.get("counters", {})
          print("- Total BUY Telegram API accepts:", counts.get("alerts_sent", 0))
          print("- SPORTS BUY accepts after topic telemetry enabled:",
                counts.get("alerts_sports", 0))
          print("- BTC BUY accepts after topic telemetry enabled:",
                counts.get("alerts_btc", 0))
          for topic in ("sports", "btc"):
              print(f"- {topic.upper()} source BUY candidates (post topic/size/dedupe):",
                    counts.get("eligible_source_buy_" + topic, 0))
              print(f"- {topic.upper()} book-verified:",
                    counts.get("book_verified_" + topic, 0))
              print(f"- {topic.upper()} recent-form verified:",
                    counts.get("recent_verified_" + topic, 0))
              print(f"- {topic.upper()} full-portfolio verified:",
                    counts.get("portfolio_verified_" + topic, 0))
          print("- Active portfolio API incomplete/error rejections:",
                counts.get("active_form_request_error", 0))
          print("- Excluded major unredeemed-loss clusters (90d activity):",
                counts.get("major_unredeemed_loss_cluster_90d", 0))
          print("- Screenshot-supported suspected-loss wallet quarantined:", True)
          print("- Prospective hypothetical $5 entry quotes recorded:",
                len(data.get("signal_evidence") or {}))
          print("- Forward quote timestamps may be a few seconds after poll start; now retained.")
          print("- New quote records include $5 VWAP, orderbook shares and timing.")
          print("- Book-depth and final payout evidence feed read-only fee-model reports.")
          print("- BOOK-VERIFIED SPORTS SHADOW quotes (NOT sent, NOT filled):"
                len(data.get("shadow_evidence") or {}))
          print("- OPEN-position (NOT BUY) Telegram accepts:",
                counts.get("open_alerts_sent", 0))
          print("- OPEN positions sent, deduped:",len(data.get("open_sent") or {}))
          print("- OPEN book-price observations, NOT real fills:",
                len(data.get("open_position_evidence") or {}))
          print("- OPEN scans with incomplete risk API:",
                counts.get("open_risk_api_incomplete", 0))
          print("- Shadow quotes do not bypass wallet risk vetoes.")
          print("- These are NOT filled orders or the user's realized returns.")
          print("- The historic BUY total predates per-topic classification.")
          print("- Latest rejection counts:", last.get("this_poll", {}))
          print("- Telegram server acceptance is not proof of phone notification.")
          PY
          if (( errors >= 3 && errors * 5 >= pass )); then
            echo "V33 FAILURE: excessive failed polls (${errors}/${pass})"
            exit 1
          fi

      - name: Persist ONLY v3.3 signal state on research branch
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/v33_signal_state.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(v3.3): isolated Telegram signal cursors [skip ci]'
            pushed=false
            for attempt in 1 2 3 4 5; do
              git fetch origin v3.3-wallet-research
              git rebase origin/v3.3-wallet-research
              if git push origin HEAD:v3.3-wallet-research; then
                pushed=true
                break
              fi
              sleep 3
            done
            test "$pushed" = true
          fi
