name: v3.3 Risk Gate Audit - Offline Only
on:
  push:
    branches:
      - audit/v33-risk-gate-20261017
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile audit code
        run: python -m py_compile tools/v33_signal_bot.py tools/v33_open_positions.py tests/test_v33_signal_bot.py tests/test_v33_open_positions.py
      - name: Run v3.3 signal regressions with no credentials or network calls
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_v33_signal_bot.py' -v
      - name: Run v3.3 OPEN position regressions
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_v33_open_positions.py' -v
      - name: Test bounded wallet score and timestamp diagnosis
        env:
          PYTHONPATH: .
        run: |
          python -m py_compile tools/v33_wallet_gate_shadow_audit.py tests/test_v33_wallet_gate_shadow_audit.py
          python -m unittest discover -s tests -p 'test_v33_wallet_gate_shadow_audit.py' -v
      - name: Public v2 timestamp and loss inventory smoke - research only
        continue-on-error: true
        env:
          PYTHONPATH: .
        run: python tools/v33_wallet_gate_shadow_audit.py --live
      - name: Read-only checkout of latest v3.3 research snapshots
        uses: actions/checkout@v4
        with:
          ref: v3.3-wallet-research
          path: v33-snapshot
          persist-credentials: false
          fetch-depth: 1
      - name: Offline proof that the 350 pilot only extends the existing qualified 300
        env:
          PYTHONPATH: .
          V33_PRIORITY_WALLETS: '0x5b6331e7ff0831a3fe2ed12004747db1a9c911a4'
          V33_QUARANTINE_WALLETS: '0x31550df5402226b825f900a31659a05d809d268e,0x300317934bfe0cc8740affc7425b0cd3772530f5,0x6b1dbe91847aa95386fc63669ff910e68469a01a,0xa772e2ca9f119162d03330f3e66c0556a2068686'
        run: |
          python - <<'PY'
          import json, time
          from tools import v33_signal_bot as bot
          data=json.load(open("v33-snapshot/research/v33_wallet_shortlist.json"))
          now=int(time.time())
          bot.MAX_WALLETS=300
          base=bot.select_wallets(data,now)
          bot.MAX_WALLETS=350
          extended=bot.select_wallets(data,now)
          assert len(base)==300, len(base)
          assert len(extended)>len(base) and len(extended)<=350, len(extended)
          assert set(base).issubset(set(extended)), "Pilot would replace an existing watched wallet"
          assert not (set(extended)&bot.QUARANTINE_WALLETS), "Quarantine leak"
          extra=set(extended)-set(base)
          print("V33 LIVE PILOT OFFLINE ELIGIBILITY",
                {"old_watching":len(base),"pilot_watching":len(extended),
                 "new_wallets":len(extra),
                 "additional_sports_seen_24h":sum(
                     0<=now-int(extended[x].get("last_sports_buy") or 0)<=86400
                     for x in extra)})
          print("All legacy scoring gates and user exclusions intact; no network or Telegram.")
          PY
      - name: Build research-only top-300 shadow verification queue
        env:
          PYTHONPATH: .
          V33_SHADOW_INPUT_DIR: v33-snapshot
          V33_SHADOW_INPUT_REF: v3.3-wallet-research
        run: |
          python -m py_compile tools/v33_research_shadow_queue.py tests/test_v33_research_shadow_queue.py
          python -m unittest discover -s tests -p 'test_v33_research_shadow_queue.py' -v
          echo "Snapshot SHA: $(git -C v33-snapshot rev-parse HEAD)"
          python tools/v33_research_shadow_queue.py
      - name: Enumerate 1200 sports-active shadow wallets from full universe (NO MONITORING)
        env:
          PYTHONPATH: .
          V33_BROAD_INPUT_DIR: v33-snapshot
        run: |
          python -m py_compile tools/v33_broad_sports_research.py tests/test_v33_broad_sports_research.py
          python -m unittest discover -s tests -p 'test_v33_broad_sports_research.py' -v
          python tools/v33_broad_sports_research.py
      - name: Offline test restricted public trade capacity canary
        env:
          PYTHONPATH: .
        run: |
          python -m py_compile tools/v33_broad_sports_capacity_canary.py tests/test_v33_broad_sports_capacity_canary.py
          python -m unittest discover -s tests -p 'test_v33_broad_sports_capacity_canary.py' -v
      - name: Test complete-page v2 cursor scanning with safe overload abort
        env:
          PYTHONPATH: .
        run: |
          python -m py_compile tools/v33_pagination_capacity_benchmark.py tests/test_v33_pagination_capacity_benchmark.py
          python -m unittest discover -s tests -p 'test_v33_pagination_capacity_benchmark.py' -v
      # Heavy public probes are OPT-IN. Trigger with commit marker
      # [capacity-canary] or explicit workflow dispatch; routine audit pushes
      # must never repeatedly load the API shared with the live 300 wallets.
      - name: Up to 60 research wallets - 48 recent one-hour, 12 high-volume six-hour paginated audits
        if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[capacity-canary]') }}
        continue-on-error: true
        env:
          PYTHONPATH: .
        run: python -u tools/v33_pagination_capacity_benchmark.py
      - name: Offline tests for deeper heavy wallet pagination
        env:
          PYTHONPATH: .
        run: |
          python -m py_compile tools/v33_heavy_wallet_deep_paging.py tests/test_v33_heavy_wallet_deep_paging.py
          python -m unittest discover -s tests -p 'test_v33_heavy_wallet_deep_paging.py' -v
      - name: Verify capped heavy wallets with read-only deeper pagination
        if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[capacity-canary]') }}
        continue-on-error: true
        env:
          PYTHONPATH: .
        run: python tools/v33_heavy_wallet_deep_paging.py
      - name: Test durable rejected quote archival and old-first resolution audit
        env:
          PYTHONPATH: .
        run: |
          python -m py_compile tools/v33_result_audit.py tests/test_v33_result_audit.py
          python -m unittest discover -s tests -p 'test_v33_result_audit.py' -v
      - name: Read-only 10-market shadow settlement probe (public data, no Telegram)
        continue-on-error: true
        env:
          PYTHONPATH: .
          V33_SHADOW_PROBE_INPUT_DIR: v33-snapshot
        run: |
          python -m py_compile tools/v33_shadow_resolution_probe.py tests/test_v33_shadow_resolution_probe.py
          python -m unittest discover -s tests -p 'test_v33_shadow_resolution_probe.py' -v
          python tools/v33_shadow_resolution_probe.py
      - name: Independently validate quoted-price sports copyability and filter evidence
        env:
          PYTHONPATH: .
          V33_COPY_AUDIT_INPUT_DIR: v33-snapshot
        run: |
          python -m py_compile tools/v33_copyability_validation.py tests/test_v33_copyability_validation.py
          python -m unittest discover -s tests -p 'test_v33_copyability_validation.py' -v
          python tools/v33_copyability_validation.py
      - name: Regression tests for durable archive and noncausal paper cohorts
        env:
          PYTHONPATH: .
        run: |
          python -m py_compile tools/v33_shadow_checkpoint.py tests/test_v33_shadow_checkpoint.py
          python -m unittest discover -s tests -p 'test_v33_shadow_checkpoint.py' -v
          python -m py_compile tools/v33_checkpoint_paper_comparison.py tests/test_v33_checkpoint_paper_comparison.py
          python -m unittest discover -s tests -p 'test_v33_checkpoint_paper_comparison.py' -v
      - name: Upload public aggregate diagnostic (no Telegram or wallet keys)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v33-audit-risk-diagnostics
          path: |
            artifacts/v33-risk-api-audit.json
            artifacts/v33-shadow-wallet-queue.json
            artifacts/v33-copyability-gate.json
            artifacts/v33-shadow-resolution-probe.json
            artifacts/v33-broad-sports-watch-research.json
            artifacts/v33-broad-sports-pagination-benchmark.json
            artifacts/v33-broad-sports-deep-paging.json
          if-no-files-found: ignore
          retention-days: 7
