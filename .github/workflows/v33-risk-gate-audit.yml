name: v3.3 Risk Gate Audit - Offline Only
on:
  push:
    branches:
      - audit/v33-risk-gate-20261017
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile audit code
        run: python -m py_compile tools/v33_signal_bot.py tools/v33_open_positions.py tests/test_v33_signal_bot.py tests/test_v33_open_positions.py
      - name: Run v3.3 signal regressions with no credentials or network calls
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_v33_signal_bot.py' -v
      - name: Run v3.3 OPEN position regressions
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_v33_open_positions.py' -v
      - name: Test bounded wallet score and timestamp diagnosis
        env:
          PYTHONPATH: .
        run: |
          python -m py_compile tools/v33_wallet_gate_shadow_audit.py tests/test_v33_wallet_gate_shadow_audit.py
          python -m unittest discover -s tests -p 'test_v33_wallet_gate_shadow_audit.py' -v
      - name: Public v2 timestamp and loss inventory smoke - research only
        continue-on-error: true
        env:
          PYTHONPATH: .
        run: python tools/v33_wallet_gate_shadow_audit.py --live
      - name: Read-only checkout of latest v3.3 research snapshots
        uses: actions/checkout@v4
        with:
          ref: v3.3-wallet-research
          path: v33-snapshot
          persist-credentials: false
          fetch-depth: 1
      - name: Build research-only top-300 shadow verification queue
        env:
          PYTHONPATH: .
          V33_SHADOW_INPUT_DIR: v33-snapshot
          V33_SHADOW_INPUT_REF: v3.3-wallet-research
        run: |
          python -m py_compile tools/v33_research_shadow_queue.py tests/test_v33_research_shadow_queue.py
          python -m unittest discover -s tests -p 'test_v33_research_shadow_queue.py' -v
          echo "Snapshot SHA: $(git -C v33-snapshot rev-parse HEAD)"
          python tools/v33_research_shadow_queue.py
      - name: Test durable rejected quote archival and old-first resolution audit
        env:
          PYTHONPATH: .
        run: |
          python -m py_compile tools/v33_result_audit.py tests/test_v33_result_audit.py
          python -m unittest discover -s tests -p 'test_v33_result_audit.py' -v
      - name: Read-only 10-market shadow settlement probe (public data, no Telegram)
        continue-on-error: true
        env:
          PYTHONPATH: .
          V33_SHADOW_PROBE_INPUT_DIR: v33-snapshot
        run: |
          python -m py_compile tools/v33_shadow_resolution_probe.py tests/test_v33_shadow_resolution_probe.py
          python -m unittest discover -s tests -p 'test_v33_shadow_resolution_probe.py' -v
          python tools/v33_shadow_resolution_probe.py
      - name: Independently validate quoted-price sports copyability and filter evidence
        env:
          PYTHONPATH: .
          V33_COPY_AUDIT_INPUT_DIR: v33-snapshot
        run: |
          python -m py_compile tools/v33_copyability_validation.py tests/test_v33_copyability_validation.py
          python -m unittest discover -s tests -p 'test_v33_copyability_validation.py' -v
          python tools/v33_copyability_validation.py
      - name: Upload public aggregate diagnostic (no Telegram or wallet keys)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v33-audit-risk-diagnostics
          path: |
            artifacts/v33-risk-api-audit.json
            artifacts/v33-shadow-wallet-queue.json
            artifacts/v33-copyability-gate.json
            artifacts/v33-shadow-resolution-probe.json
          if-no-files-found: ignore
          retention-days: 7
