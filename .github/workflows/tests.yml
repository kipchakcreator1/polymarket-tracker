name: Tracker 3.2 Offline Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python source
        run: |
          python -m py_compile smart_tracker_v2.py smart_tracker_v3.py paper_tracker_v31.py wallet_discovery_v32.py tests/test_tracker_v32.py
      - name: Offline unit tests (no API keys, Telegram or real trades)
        run: |
          python -m unittest discover -s tests -v
