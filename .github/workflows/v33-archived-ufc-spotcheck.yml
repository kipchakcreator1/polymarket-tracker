name: v3.3 Archived UFC Resolution Spotcheck (READ ONLY)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/v33-archived-ufc-spotcheck.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout isolated v3.3 code
        uses: actions/checkout@v4
        with:
          ref: v3.3-wallet-research
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit test no false certified last-30 with missing final outcomes
        env:
          PYTHONPATH: .
        run: |
          python -m unittest discover -s tests -p 'test_v33_result_audit.py' -v
      - name: Verify research ranking has no false confident wallet
        env:
          PYTHONPATH: .
        run: |
          python -m unittest discover -s tests -p 'test_v33_evidence_rank.py' -v
          python -u tools/v33_evidence_rank.py
          python - <<'PY'
          import json
          r=json.load(open('research/v33_evidence_rank.json'))
          assert r['n_live_approved']==0, 'Research cannot silently promote live picks'
          print('EVIDENCE STATUS:',r['n_wallets_audited'],
                'wallets;',r['n_historical_audit_ready'],'certified historical;',
                r['n_forward_paper_evaluable'],'forward paper ROI samples')
          PY
      - name: Prove old UFC losses by exact token index plus final settlement
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json
          import smart_tracker_v2 as api
          from tools import v33_result_audit as audit
          wallet="0x31550df5402226b825f900a31659a05d809d268e"
          p=api.request_json("/v2/positions",{"user":wallet,
             "status":"REDEEMABLE_LOST","include_archived":"true","limit":6,
             "sort_by":"UNREALIZED_PNL","sort_direction":"ASC"},tries=2)
          rows=p["data"]
          assert len(rows)>=2, "Cannot audit missing losing positions"
          gc,rc={},{}
          verified=0
          for row in rows:
              cond=str(row["condition_id"]).lower()
              tok=str(row["token_id"])
              verdict,settled=audit.classify(cond,tok,gc,rc)
              print(json.dumps({"condition":cond[:18],"market":row.get("title"),
                 "loss_usd":row.get("unrealized_pnl"),
                 "outcome_index":row.get("outcome_index"),
                 "final_verdict":verdict,"settled_at":settled}))
              if verdict=="loss" and settled:
                  verified+=1
          print(f"Verified UFC losers by independent V2 payout: {verified}/{len(rows)}")
          assert verified>=2, "Archived result mapping still unverified"
          PY
      - name: Verify closed-profitability versus surviving resolved-loss inventory
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json
          from tools import v33_result_audit as audit
          wallet="0x31550df5402226b825f900a31659a05d809d268e"
          rows, complete=audit.fetch_position_history(wallet)
          snapshot=audit.position_accounting_snapshot(rows,complete)
          print("UFC ACCOUNTING SNAPSHOT:",json.dumps(snapshot,sort_keys=True))
          assert snapshot["unredeemed_major_losers_100usd"]>=5, (
              "Unexpectedly missing known UFC loss positions")
          print("SUCCESS: closed trade profitability is not sportsbook winrate")
          PY
