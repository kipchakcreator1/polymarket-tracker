name: v3.3 Sports Truth Research (NO TELEGRAM)

# Verify resolved picks against final market payouts. Read-only public APIs.
# Never sends a Telegram BUY and never places orders.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/v33-sports-truth-research.yml']
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v33-sports-truth-research
  cancel-in-progress: false

jobs:
  outcome-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout isolated v3.3 research branch
        uses: actions/checkout@v4
        with:
          ref: v3.3-wallet-research
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prove archived UFC payouts via V2 tokens and complete maker/taker history
        env:
          PYTHONPATH: .
        run: |
          python -m py_compile tools/v33_result_audit.py
          python -m unittest discover -s tests -p 'test_v33_result_audit.py' -v
      - name: Inspect final-state API evidence for quarantined UFC wallet
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from smart_tracker_v2 import request_json
          from tools import v33_signal_bot as bot
          w="0x31550df5402226b825f900a31659a05d809d268e"
          try:
              p=request_json("/v2/positions", {"user":w,"status":"REDEEMABLE_LOST",
                 "include_archived":"true","limit":3,"sort_by":"UNREALIZED_PNL",
                 "sort_direction":"ASC"},tries=2,timeout=18)
              rows=p.get("data",[]) if isinstance(p,dict) else []
              print("UFC LOSS POSITION API: rows",len(rows),
                    "has_more",p.get("pagination",{}).get("has_more"))
              for row in rows[:2]:
                  c=str(row.get("condition_id") or "")
                  print("LOSS SAMPLE:", c[:16], "pnl", row.get("unrealized_pnl"),
                        "redeemable",row.get("redeemable"),
                        "closed_position_status",row.get("status"),
                        "title",str(row.get("title") or "")[:90])
                  if not c.startswith("0x"):
                      continue
                  try:
                      rr=request_json("/v2/resolutions",{"condition":c},
                         tries=2,timeout=18)
                      d=rr.get("data") if isinstance(rr,dict) else None
                      print("V2 FINAL API:",c[:16],"rows",
                            len(d) if isinstance(d,list) else "invalid",
                            "states",[(x.get("status"),x.get("payouts"),
                            x.get("resolved_at")) for x in (d or [])[:2]])
                      tt=request_json("/v2/tokens",{"token_id":str(row.get("token_id") or "")},
                         tries=2,timeout=18)
                      t=next((x for x in tt.get("data",[]) if
                         str(x.get("token_id") or "")==str(row.get("token_id") or "") and
                         str(x.get("condition_id") or "").lower()==c.lower()),{})
                      print("V2 TOKEN FINAL:",c[:16],
                         {k:t.get(k) for k in ("outcome_index","clob_index",
                          "resolved","closed","final_price","event_slug","module")})
                  except Exception as exc:
                      print("UFC FINAL SAMPLE ERROR",type(exc).__name__,str(exc)[:100])
          except Exception as exc:
              print("UFC LOSS DIAGNOSTIC ERROR",type(exc).__name__,str(exc)[:100])
          PY
      - name: Analyze actual sports picks using public resolutions
        env:
          PYTHONPATH: .
          V33_TRUTH_WALLETS_PER_RUN: '2'
          V33_TRUTH_TRADE_PAGES: '16'
          V33_TRUTH_LOOKBACK_DAYS: '180'
          V33_TRUTH_FOCUS_WALLET: '0x31550df5402226b825f900a31659a05d809d268e'
        run: |
          python -u tools/v33_result_audit.py
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          report = json.load(open("research/v33_truth_report.json"))
          counts = report["alerts"]["summary"]
          print("### Sports pick outcome verification (not trading PnL)")
          print("- Previously sent BUYs resolved WIN:", counts["win"])
          print("- Previously sent BUYs resolved LOSS:", counts["loss"])
          print("- Unresolved or ambiguous:", counts["unresolved_or_uncertain"])
          print("- Not checked this pass:", counts.get("not_checked", 0))
          print("- Category unverified/not sports:", counts["not_verified_sport"])
          print("- Research API errors:", counts["api_error"])
          print("- Forward $5 paper-hold samples:", counts.get("paper_hold_sample", 0))
          print("- Forward paper HOLD PnL before fees ($):",
                counts.get("paper_hold_pnl_no_fees", 0))
          print("- Wallet samples processed:", len(report["wallets"]))
          print("- Complete 180d maker+taker trade windows:", sum(
            bool(x.get("trade_window_complete")) for x in report["wallets"].values()))
          print("- Complete assessed sports-market scans:", sum(
            bool(x.get("market_scan_complete")) for x in report["wallets"].values()))
          focus="0x31550df5402226b825f900a31659a05d809d268e"
          case=report["wallets"].get(focus, {})
          print("- UFC case-study wallet audited:", bool(case))
          print("- UFC case-study verified resolved outcomes:",
                case.get("position_truth", {}).get("resolved_sports_sample",
                         case.get("resolved_sports_sample", 0)))
          print("- UFC case-study history complete:",
                bool(case.get("position_truth", {}).get("certified_sample")))
          print("- UFC position accounting:",
                case.get("position_truth", {}).get("position_accounting", {}))
          print("- UFC unknown outcomes by reason:",
                case.get("position_truth", {}).get("status_counts", {}))
          print("- Wallet position-history samples:", sum(
                bool(x.get("position_truth")) for x in report["wallets"].values()))
          print("- Verified closed-profitable but wrong-direction examples:", sum(
                x.get("position_truth", {}).get("profitable_closed_wrong_direction", 0)
                for x in report["wallets"].values()))
          print("- Certified complete samples >=20:", sum(
            bool(x.get("certified_sample")) for x in report["wallets"].values()))
          print("- Certified cross-validated position samples:", sum(
            bool(x.get("position_truth", {}).get("certified_sample"))
            for x in report["wallets"].values()))
          print("- Old alert entry asks were not recorded; paper PnL is forward-only.")
          print("- No real user fills or post-entry cashouts are assumed.")
          PY
      - name: Persist ONLY independent research outcomes
        if: success()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/v33_truth_report.json
          if ! git diff --cached --quiet; then
            git commit -m 'research(v3.3): verified sports wallet outcomes [skip ci]'
            saved=false
            for i in 1 2 3 4 5; do
              git fetch origin v3.3-wallet-research
              git rebase origin/v3.3-wallet-research
              if git push origin HEAD:v3.3-wallet-research; then
                saved=true
                break
              fi
              sleep 3
            done
            test "$saved" = true
          fi
