name: Kalshi 12h Research (continuous 5-minute PAPER loop)

# 12h prospective market observations: 2026-10-14 06:54Z -> 18:54Z.
# Hosted runners: 6h maximum per job. The Python loop uses at most 4h50
# before dispatching a successor. Only observations, NO real Kalshi orders.
# CRON REMOVED: avoid skipped/massively delayed 5-minute schedule triggers.
# Continuation is still best-effort: hosted runner/API interruptions can happen.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kalshi-12h-research.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: kalshi-12h-prospective-unique-writer
  cancel-in-progress: false

jobs:
  continuous-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout isolated 12-hour research branch
        uses: actions/checkout@v4
        with:
          ref: kalshi-12h-research
          persist-credentials: true
          fetch-depth: 0

      - name: Install Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check paper-only safety and continuation logic
        run: |
          python -m py_compile kalshi99/experiment12h.py kalshi99/experiment12h_telegram.py kalshi99/loop12h.py
          python -m unittest kalshi99.test_scanner kalshi99.test_experiment12h kalshi99.test_experiment12h_telegram kalshi99.test_loop12h -v

      - name: Continuously scan, notify Tracker 3.2, and persist each 5m tick
        id: loop
        env:
          KALSHI_INITIAL_CHAIN_PROBE: ${{ github.event_name == 'push' && '1' || '0' }}
          TELEGRAM_V31_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_V32_BOT_TOKEN: ${{ secrets.TELEGRAM_V32_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u -m kalshi99.loop12h

      - name: Pass running experiment to next hosted runner if needed
        if: ${{ steps.loop.outputs.chain == 'true' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'kalshi-12h-research.yml',
              ref: 'main'
            });
