name: Kalshi 12h Research (5-minute paper scans)

# Finite 12-hour window: 2026-10-14 06:54Z to 18:54Z.
# Python strictly guards end UTC even if GitHub cron remains enabled.
# All code + research state live on kalshi-12h-research; never trade real money.
# Primary PAPER portfolio buys observed 98-99c asks regardless of their closing time.
# 12 hours is ONLY the observation window, NOT an expiration requirement for a trade.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kalshi-12h-research.yml'
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kalshi-12h-prospective-unique-writer
  cancel-in-progress: false

jobs:
  read-only-research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4
        with:
          ref: kalshi-12h-research
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Offline tests, no credentials
        run: |
          python -m py_compile kalshi99/experiment12h.py kalshi99/test_experiment12h.py kalshi99/experiment12h_telegram.py kalshi99/test_experiment12h_telegram.py
          python -m unittest kalshi99.test_scanner kalshi99.test_experiment12h kalshi99.test_experiment12h_telegram -v

      - name: Prospectively sample public Kalshi asks (PAPER ONLY, 12h cutoff)
        run: |
          python -m kalshi99.experiment12h

      - name: Save 5-minute research snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kalshi-12h-prospective-report
          path: artifacts/kalshi-12h-latest.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Persist ONLY separate experiment research files
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A research/
          if ! git diff --cached --quiet; then
            git commit -m 'chore: 12h public-only market observation [skip ci]'
            git pull --rebase origin kalshi-12h-research
            git push origin HEAD:kalshi-12h-research
          fi
      - name: Send 12h Kalshi PAPER signals and summaries via Tracker 3.2 bot
        if: success()
        env:
          TELEGRAM_V31_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_V32_BOT_TOKEN: ${{ secrets.TELEGRAM_V32_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m kalshi99.experiment12h_telegram

      - name: Save Telegram dedup checkpoint to 12h research branch ONLY
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A research/kalshi-12h-telegram.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: 12h Telegram acknowledgment [skip ci]'
            git pull --rebase origin kalshi-12h-research
            git push origin HEAD:kalshi-12h-research
          fi
