name: One-off v3.2 wallet copyability audit (READ ONLY)

# Single-shot research only; NEVER schedules, Telegram messages, real trades,
# promotion to production watchlist, or production state changes.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wallet-shadow-audit-once.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wallet-shadow-v32-one-off-audit
  cancel-in-progress: false

jobs:
  wallet-copyability-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out isolated v3.2 testing branch only
        uses: actions/checkout@v4
        with:
          ref: tracker-v3.2-testing
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Audit public recent trades for eligible wallets, WITHOUT alerts or orders
        env:
          SHADOW_WALLET_SAMPLE: '450'
          SHADOW_LOOKBACK_MINUTES: '70'
          SHADOW_REPORT_PATH: 'artifacts/shadow-observation.json'
        run: |
          python -m py_compile tools/shadow_qualified_v32.py smart_tracker_v3.py copy_quality_v32.py
          PYTHONPATH=. python -u tools/shadow_qualified_v32.py

      - name: Save raw read-only snapshot as a diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wallet-shadow-audit-v32-once
          path: artifacts/shadow-observation.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Persist ONLY the one-time research snapshot on testing branch
        if: success()
        run: |
          mkdir -p research
          cp artifacts/shadow-observation.json research/wallet-shadow-v32-2026-10-14.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/wallet-shadow-v32-2026-10-14.json
          if ! git diff --cached --quiet; then
            git commit -m 'research: one-time public copyability shadow snapshot [skip ci]'
            git pull --rebase origin tracker-v3.2-testing
            git push origin HEAD:tracker-v3.2-testing
          fi
