name: v3.3 Signal Offline Tests (NO TELEGRAM)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/v33-signal-tests.yml', '.github/workflows/v33-telegram.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3.3-wallet-research
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 'CRITICAL: forward paper quotes persist after same-poll time advance; all BUY safeguards'
        env:
          PYTHONPATH: .
          V33_PRIORITY_WALLETS: '0x5b6331e7ff0831a3fe2ed12004747db1a9c911a4'
          V33_MONITOR_MAX: '300'
          V33_MIN_TRADE_USD: '35'
          V33_MARKET_FOCUS: 'sports_btc'
          V33_MAX_ALERTS: '10'
        run: |
          python -m py_compile tools/v33_signal_bot.py tests/test_v33_signal_bot.py
          python -m unittest discover -s tests -p 'test_v33_signal_bot.py' -v
