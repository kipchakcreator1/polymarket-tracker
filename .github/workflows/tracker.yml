name: Polymarket Smart Money Tracker v2

on:
  schedule:
    - cron: "3-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: polymarket-smart-tracker-v2
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore historical tracker state
        uses: actions/cache@v4
        with:
          path: state/smart_tracker_v2.json
          key: polymarket-smart-v2-${{ github.run_id }}
          restore-keys: |
            polymarket-smart-v2-

      - name: Discover, score and monitor Polymarket traders
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CANDIDATE_TARGET: "1250"
          SCORE_BATCH: "80"
          MAX_TRACKED: "250"
          MIN_WINRATE: "0.70"
          MIN_CLOSED: "30"
          MIN_REALIZED_PNL: "100"
          MIN_TRADE_USD: "1"
          SAMPLE_CLOSED: "100"
          MAX_ALERTS: "15"
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 smart_tracker_v2.py --notify-status
          else
            python3 smart_tracker_v2.py
          fi

