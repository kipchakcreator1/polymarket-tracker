name: Polymarket Smart Tracker v3.1 Fresh

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: polymarket-smart-tracker-single-writer
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # One-time optional import of v2's publicly sourced candidate list.
      - name: Restore old candidate list (first run only)
        if: ${{ hashFiles('state/smart_tracker_v3.json') == '' }}
        uses: actions/cache/restore@v4
        with:
          path: state/smart_tracker_v2.json
          key: migrate-v2-do-not-match-exactly
          restore-keys: |
            polymarket-smart-v2-

      - name: Monitor public trades and Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CANDIDATE_TARGET: '1250'
          SCORE_BATCH: '80'
          MAX_TRACKED: '50'
          MONITOR_MAX: '50'
          MIN_WINRATE: '0.70'
          MIN_CLOSED: '30'
          MIN_REALIZED_PNL: '100'
          SAMPLE_CLOSED: '100'
          MIN_BUY_USD: '100'
          MIN_SELL_USD: '20'
          MAX_ALERTS: '6'
          MAX_PER_WALLET: '2'
          GROUP_SECONDS: '60'
          MAX_SIGNAL_AGE: '300'
          VERIFY_MARKET: '1'
          PAGES_PER_WALLET: '10'
          PAPER_FRICTION_PCT: '0.01' # hypothetical sensitivity only; NOT actual fees
          PAPER_SETTLEMENT_CHECKS: '12'
          PAPER_MAX_RECORDS: '2000'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 smart_tracker_v3.py --notify-status
          else
            python3 smart_tracker_v3.py
          fi

      - name: Save public state to GitHub
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/smart_tracker_v3.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update public tracker state [skip ci]'
            git push origin HEAD:main
          fi

