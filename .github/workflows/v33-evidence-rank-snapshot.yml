name: v3.3 Sports Evidence Rank Snapshot (NO TELEGRAM)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/v33-evidence-rank-snapshot.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Same lock as hourly outcome audit: never race on the same rank JSON.
  group: v33-sports-truth-research
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3.3-wallet-research
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify event-level statistics cannot be falsely promoted
        env:
          PYTHONPATH: .
        run: |
          python -m unittest discover -s tests -p 'test_v33_evidence_rank.py' -v
          python -u tools/v33_evidence_rank.py
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          o=json.load(open("research/v33_evidence_rank.json"))
          print("### Verified sports wallet research — NOT copy advice")
          print("- Wallet histories audited:",o["n_wallets_audited"])
          print("- Historical evidence complete:",o["n_historical_audit_ready"])
          print("- Forward paper evaluation-ready:",o["n_forward_paper_evaluable"])
          print("- Live-approved wallets:",o["n_live_approved"])
          print("- Any incomplete history has explicit blocking reasons.")
          PY
      - name: Save audit ranking to research branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/v33_evidence_rank.json
          if ! git diff --cached --quiet; then
            git commit -m 'research(v3.3): evidence-only sports rank [skip ci]'
            for attempt in 1 2 3 4 5; do
              git fetch origin v3.3-wallet-research
              if git rebase origin/v3.3-wallet-research && git push origin HEAD:v3.3-wallet-research; then
                exit 0
              fi
              sleep 3
            done
            exit 1
          fi
