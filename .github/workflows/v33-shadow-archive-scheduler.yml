name: v3.3 Shadow Archive Research Scheduler (NO TELEGRAM)
# Research-only, read-only Polymarket public data. Checkout of the running
# bot's research branch is read-only. Persist ONLY to isolated audit branch.
# The existing v3.3 Telegram and trading workflows are not modified.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/v33-shadow-archive-scheduler.yml']
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v33-shadow-checkpoint-archive
  cancel-in-progress: false
jobs:
  archival:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout audit code and existing checkpoint, not the live bot
        uses: actions/checkout@v4
        with:
          ref: audit/v33-risk-gate-20261017
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fail closed if archive/tests are broken
        env:
          PYTHONPATH: .
        run: |
          python -m py_compile tools/v33_shadow_checkpoint.py tests/test_v33_shadow_checkpoint.py
          python -m unittest discover -s tests -p 'test_v33_shadow_checkpoint.py' -v
          python -m unittest discover -s tests -p 'test_v33_result_audit.py' -v
          python -m py_compile tools/v33_checkpoint_paper_comparison.py tests/test_v33_checkpoint_paper_comparison.py
          python -m unittest discover -s tests -p 'test_v33_checkpoint_paper_comparison.py' -v
          python -m py_compile tools/v33_risk_reason_outcome_audit.py tests/test_v33_risk_reason_outcome_audit.py
          python -m unittest discover -s tests -p 'test_v33_risk_reason_outcome_audit.py' -v
      - name: Snapshot v3.3 live research state READ ONLY
        uses: actions/checkout@v4
        with:
          ref: v3.3-wallet-research
          path: v33-snapshot
          fetch-depth: 1
          persist-credentials: false
      - name: Retain and classify at most 25 public outcomes
        env:
          PYTHONPATH: .
          V33_CHECKPOINT_SOURCE_DIR: v33-snapshot
          V33_SHADOW_MAX_API_CHECKS: '25'
          V33_SHADOW_SCHEDULE_RUNS_PER_HOUR: '6'
        run: |
          python -u tools/v33_shadow_checkpoint.py
          python - <<'PY'
          import json, pathlib, os
          data=json.loads(pathlib.Path("research/v33-shadow-outcome-checkpoint.json").read_text())
          metrics=data["meta"]
          dst=pathlib.Path("artifacts/v33-shadow-checkpoint-health.json")
          dst.parent.mkdir(parents=True,exist_ok=True)
          dst.write_text(json.dumps(metrics,indent=2,sort_keys=True)+"\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as out:
              out.write("## Isolated public sports shadow archive (no orders)\n")
              for key in ("completed_runs","archived_rows","archived_quotes_at_original_observation",
                          "newly_final_by_decision","not_yet_terminal",
                          "minimum_runs_to_recheck_current_backlog",
                          "ring_rate_proxy_per_hour_not_verified_arrival_rate",
                          "configured_max_checks_per_hour",
                          "risk_of_unobserved_ring_evictions","coverage_breach_or_unknown"):
                  out.write(f"- {key}: {metrics.get(key)}\n")
              out.write("- The saved checkpoint is NOT a live trading strategy.\n")
          PY
      - name: Describe archived rejected vs sent paper quotes (NO FILLS)
        env:
          PYTHONPATH: .
          V33_COMPARE_SOURCE_DIR: v33-snapshot
        run: |
          python tools/v33_checkpoint_paper_comparison.py
          python - <<'PY'
          import json, os, pathlib
          report=json.loads(pathlib.Path("artifacts/v33-rejected-vs-sent-paper.json").read_text())
          support=report["quote_price_time_support"]
          maturity=report["original_quote_outcome_maturity_by_time_odds"]
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as out:
              out.write("\n## Odds/time support and settlement censoring\n")
              out.write(f"- Sent/rejected pairs within 5c and 6h: {support['one_to_one_pairs']}\n")
              out.write(f"- Unpaired sent quotes: {support['sent_unpaired']}\n")
              out.write(f"- Unpaired rejected quotes: {support['blocked_unpaired']}\n")
              for cohort in ("telegram_sent","blocked_recent"):
                  row=maturity["cohorts"][cohort]
                  out.write(f"- {cohort} saved quote conditions: {row['unique_quote_conditions']}; "
                            f"final: {row['final_outcomes_in_quote_journal']}; "
                            f"unknown/not-final: {row['not_final_or_unverified_in_quote_journal']}\n")
              out.write("- No same-league guarantee, causal effect estimate, or real fill ROI.\n")
          PY
      - name: Aggregate reason-labeled settled and unresolved sports BUYs (NO FILLS)
        env:
          PYTHONPATH: .
        run: |
          python tools/v33_risk_reason_outcome_audit.py
          python - <<'PY'
          import json,os,pathlib
          j=json.loads(pathlib.Path("artifacts/v33-risk-reason-settlement.json").read_text())
          groups=j["by_proven_reason_or_legacy_group"]
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("\\n## Prospective veto reasons vs official settlement\\n")
              f.write(f"- Archived position keys: {j['archived_rows']}\\n")
              f.write(f"- Historical unknown veto reason records: {j['overall_legacy_or_unproven_reason_observations']}\\n")
              for name,group in sorted(groups.items()):
                  f.write(f"- {name}: observed {group['observed_position_keys']}; "
                          f"settled {group['final_classifications']}; "
                          f"original quoted unique conditions "
                          f"{group['unique_market_conditions_with_verifiable_original_quote']}\\n")
              f.write("- Incomplete/selected market sample; NO causal filter effect or real copy ROI.\\n")
          PY
      - name: Commit only archival checkpoint to audit branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research/v33-shadow-outcome-checkpoint.json
          if git diff --cached --quiet; then
            echo "No new checkpoint data"
          else
            git commit -m "research: scheduled shadow checkpoint [skip ci]"
            git fetch origin audit/v33-risk-gate-20261017
            git rebase origin/audit/v33-risk-gate-20261017
            git push origin HEAD:refs/heads/audit/v33-risk-gate-20261017
          fi
      - name: Publish only aggregate health artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v33-shadow-hourly-health
          path: |
            artifacts/v33-shadow-checkpoint-health.json
            artifacts/v33-rejected-vs-sent-paper.json
            artifacts/v33-risk-reason-settlement.json
          if-no-files-found: ignore
          retention-days: 14
